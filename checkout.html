<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>确认订单 - 团购优选</title>
  <style>
    :root {
      --primary: #e83228;
      --primary-dark: #c92119;
      --text: #262626;
      --muted: #888;
      --page-bg: #f5f5f5;
      --border: #e9e9e9;
      --container: 1000px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--page-bg);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--primary);
      text-decoration: none;
      font-size: 23px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--primary);
      font-size: 17px;
    }

    .header-title {
      color: #555;
      font-size: 16px;
    }

    main {
      padding: 25px 0 55px;
    }

    .page-title {
      margin: 0 0 16px;
      font-size: 22px;
    }

    .panel {
      margin-bottom: 16px;
      padding: 22px;
      border-radius: 6px;
      background: #fff;
    }

    .panel-title {
      margin: 0 0 16px;
      padding-left: 9px;
      border-left: 4px solid var(--primary);
      font-size: 17px;
    }

    .address-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .address {
      position: relative;
      min-height: 112px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    .address.active {
      border: 2px solid var(--primary);
      background: #fffafa;
    }

    .address.active::after {
      content: "已选";
      position: absolute;
      right: 0;
      bottom: 0;
      padding: 3px 8px;
      border-radius: 4px 0 0;
      color: #fff;
      background: var(--primary);
      font-size: 12px;
    }

    .address-name {
      margin-bottom: 9px;
      font-size: 15px;
      font-weight: 700;
    }

    .address-phone {
      margin-left: 12px;
      color: #666;
      font-weight: 400;
    }

    .address-detail {
      color: #666;
      line-height: 1.6;
      font-size: 14px;
    }

    .order-table {
      width: 100%;
      border-collapse: collapse;
    }

    .order-table th {
      padding: 11px;
      color: #777;
      background: #fafafa;
      text-align: left;
      font-size: 13px;
      font-weight: 400;
    }

    .order-table td {
      padding: 16px 11px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .product-cell {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product-image {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
    }

    .product-name {
      line-height: 1.55;
      font-size: 14px;
    }

    .item-price,
    .item-total {
      color: var(--primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .quantity {
      display: inline-flex;
      overflow: hidden;
      border: 1px solid #d8d8d8;
      border-radius: 3px;
    }

    .quantity button {
      width: 28px;
      height: 28px;
      border: 0;
      color: #555;
      background: #f7f7f7;
      font-size: 17px;
    }

    .quantity input {
      width: 38px;
      border: 0;
      border-right: 1px solid #ddd;
      border-left: 1px solid #ddd;
      outline: 0;
      text-align: center;
    }

    .message-label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      padding: 10px;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 4px;
      outline-color: var(--primary);
    }

    .summary {
      display: flex;
      justify-content: flex-end;
      padding-top: 4px;
    }

    .summary-box {
      width: min(360px, 100%);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      color: #666;
      font-size: 14px;
    }

    .summary-row.total {
      align-items: center;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .total-price {
      color: var(--primary);
      font-size: 27px;
    }

    .submit-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      margin-top: 20px;
    }

    .submit-tip {
      color: #777;
      font-size: 13px;
    }

    .submit-button {
      min-width: 160px;
      padding: 13px 24px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: var(--primary);
      font-size: 17px;
      font-weight: 700;
    }

    .submit-button:hover {
      background: var(--primary-dark);
    }

    .empty-state {
      padding: 55px 20px;
      background: #fff;
      text-align: center;
    }

    .empty-state p {
      color: #777;
    }

    .back-button {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 4px;
      color: #fff;
      background: var(--primary);
      text-decoration: none;
    }

    .success {
      display: none;
      padding: 60px 20px;
      background: #fff;
      text-align: center;
    }

    .success h2 {
      margin: 0 0 14px;
      color: var(--primary);
    }

    .success p {
      color: #666;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 24px, var(--container));
      }

      .header-content {
        min-height: 62px;
      }

      .brand {
        font-size: 19px;
      }

      .brand-mark {
        width: 31px;
        height: 31px;
      }

      .header-title {
        font-size: 14px;
      }

      main {
        padding-top: 16px;
      }

      .page-title {
        font-size: 19px;
      }

      .panel {
        padding: 16px 12px;
      }

      .address-list {
        grid-template-columns: 1fr;
      }

      .order-table thead {
        display: none;
      }

      .order-table,
      .order-table tbody,
      .order-table tr,
      .order-table td {
        display: block;
        width: 100%;
      }

      .order-table tr {
        border-bottom: 1px solid var(--border);
      }

      .order-table td {
        padding: 9px 0;
        border: 0;
      }

      .product-cell {
        align-items: flex-start;
      }

      .product-image {
        width: 82px;
        height: 82px;
        flex-basis: 82px;
      }

      .order-table td:not(:first-child) {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #666;
        font-size: 14px;
      }

      .order-table td:not(:first-child)::before {
        color: #999;
      }

      .price-cell::before {
        content: "单价";
      }

      .quantity-cell::before {
        content: "数量";
      }

      .total-cell::before {
        content: "小计";
      }

      .submit-row {
        display: block;
      }

      .submit-tip {
        display: block;
        margin-bottom: 12px;
        text-align: right;
      }

      .submit-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-content">
      <a class="brand" href="index.html">
        <span class="brand-mark">优</span>
        <span>团购优选</span>
      </a>
      <span class="header-title">确认订单</span>
    </div>
  </header>

  <main class="container">
    <div id="orderPage">
      <h1 class="page-title">确认订单</h1>

      <section class="panel">
        <h2 class="panel-title">收货地址</h2>

        <div class="address-list">
          <div class="address active" onclick="selectAddress(this)">
            <div class="address-name">
              张小明 <span class="address-phone">138****8888</span>
            </div>
            <div class="address-detail">
              广东省深圳市南山区科技园路 88 号<br>
              优选大厦 12 楼 1208 室
            </div>
          </div>

          <div class="address" onclick="selectAddress(this)">
            <div class="address-name">
              李女士 <span class="address-phone">139****6666</span>
            </div>
            <div class="address-detail">
              广东省广州市天河区体育西路 108 号<br>
              星汇广场 A 座 503 室
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">商品信息</h2>

        <table class="order-table">
          <thead>
            <tr>
              <th>商品</th>
              <th>单价</th>
              <th>数量</th>
              <th>小计</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="product-cell">
                  <img id="productImage" class="product-image" src="" alt="">
                  <div id="productName" class="product-name"></div>
                </div>
              </td>
              <td class="price-cell">
                <span id="itemPrice" class="item-price"></span>
              </td>
              <td class="quantity-cell">
                <div class="quantity">
                  <button type="button" onclick="changeQuantity(-1)">−</button>
                  <input id="quantityInput" type="number" min="1" value="1" onchange="setQuantity(this.value)">
                  <button type="button" onclick="changeQuantity(1)">+</button>
                </div>
              </td>
              <td class="total-cell">
                <span id="itemTotal" class="item-total"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="panel">
        <label class="message-label" for="message">订单备注</label>
        <textarea id="message" placeholder="选填：请填写您与商家协商一致的内容"></textarea>
      </section>

      <section class="panel">
        <div class="summary">
          <div class="summary-box">
            <div class="summary-row">
              <span>商品金额</span>
              <span id="goodsAmount">¥0.00</span>
            </div>
            <div class="summary-row">
              <span>运费</span>
              <span id="shippingFee">¥0.00</span>
            </div>
            <div class="summary-row total">
              <span>实付款</span>
              <span id="totalPrice" class="total-price">¥0.00</span>
            </div>
          </div>
        </div>

        <div class="submit-row">
          <span class="submit-tip">提交订单即表示您同意相关服务协议</span>
          <button class="submit-button" type="button" onclick="submitOrder()">
            提交订单
          </button>
        </div>
      </section>
    </div>

    <section id="emptyState" class="empty-state" style="display: none;">
      <h2>暂未选择商品</h2>
      <p>请先从商品列表中选择需要购买的商品。</p>
      <a class="back-button" href="index.html">返回商品首页</a>
    </section>

    <section id="successState" class="success">
      <h2>订单提交成功</h2>
      <p id="successMessage"></p>
      <a class="back-button" href="index.html">继续购物</a>
    </section>
  </main>

  <script>
    let product = null;
    let quantity = 1;
    const shippingFee = 0;

    function formatPrice(price) {
      return `¥${Number(price).toFixed(2)}`;
    }

    function loadProduct() {
      const storedProduct = localStorage.getItem("selectedProduct");

      if (!storedProduct) {
        document.getElementById("orderPage").style.display = "none";
        document.getElementById("emptyState").style.display = "block";
        return;
      }

      product = JSON.parse(storedProduct);

      document.getElementById("productImage").src = product.image;
      document.getElementById("productImage").alt = product.name;
      document.getElementById("productName").textContent = product.name;
      document.getElementById("itemPrice").textContent = formatPrice(product.price);

      updateOrderAmount();
    }

    function changeQuantity(change) {
      quantity = Math.max(1, quantity + change);
      document.getElementById("quantityInput").value = quantity;
      updateOrderAmount();
    }

    function setQuantity(value) {
      const numberValue = Number(value);

      quantity = Number.isFinite(numberValue) && numberValue >= 1
        ? Math.floor(numberValue)
        : 1;

      document.getElementById("quantityInput").value = quantity;
      updateOrderAmount();
    }

    function updateOrderAmount() {
      const goodsAmount = product.price * quantity;
      const totalAmount = goodsAmount + shippingFee;

      document.getElementById("itemTotal").textContent = formatPrice(goodsAmount);
      document.getElementById("goodsAmount").textContent = formatPrice(goodsAmount);
      document.getElementById("shippingFee").textContent = formatPrice(shippingFee);
      document.getElementById("totalPrice").textContent = formatPrice(totalAmount);
    }

    function selectAddress(element) {
      document.querySelectorAll(".address").forEach(address => {
        address.classList.remove("active");
      });

      element.classList.add("active");
    }

    function submitOrder() {
      if (!product) return;

      const selectedAddress = document.querySelector(".address.active");
      const addressText = selectedAddress.innerText.replace("已选", "").trim();
      const orderNumber = `TG${Date.now().toString().slice(-10)}`;
      const totalAmount = product.price * quantity + shippingFee;

      const order = {
        orderNumber,
        product,
        quantity,
        address: addressText,
        message: document.getElementById("message").value.trim(),
        totalAmount,
        createdAt: new Date().toLocaleString()
      };

      localStorage.setItem("latestOrder", JSON.stringify(order));

      document.getElementById("orderPage").style.display = "none";
      document.getElementById("successState").style.display = "block";
      document.getElementById("successMessage").textContent =
        `订单号：${orderNumber}，应付金额：${formatPrice(totalAmount)}。`;
    }

    loadProduct();
  </script>
</body>
</html>
