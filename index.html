<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>团购优选 - 商品首页</title>
  <style>
    :root {
      --primary: #e83228;
      --primary-dark: #c92119;
      --text: #262626;
      --muted: #888;
      --page-bg: #f5f5f5;
      --border: #ededed;
      --container: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--page-bg);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      color: #777;
      background: #fff;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .topbar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 34px;
    }

    .topbar-links {
      display: flex;
      gap: 18px;
    }

    .header {
      background: #fff;
    }

    .header-content {
      display: grid;
      grid-template-columns: auto minmax(220px, 600px) auto;
      align-items: center;
      justify-content: space-between;
      gap: 36px;
      min-height: 104px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--primary);
      font-size: 26px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--primary);
      font-size: 20px;
    }

    .search {
      display: flex;
      height: 42px;
      overflow: hidden;
      border: 2px solid var(--primary);
      border-radius: 5px;
    }

    .search input {
      width: 100%;
      min-width: 0;
      padding: 0 14px;
      border: 0;
      outline: 0;
      color: var(--text);
    }

    .search button {
      width: 92px;
      flex: 0 0 92px;
      border: 0;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
    }

    .cart-button {
      position: relative;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      color: #555;
      background: #fff;
      white-space: nowrap;
    }

    .cart-count {
      position: absolute;
      top: -9px;
      right: -9px;
      display: grid;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      place-items: center;
      border-radius: 50px;
      color: #fff;
      background: var(--primary);
      font-size: 12px;
    }

    .nav {
      background: var(--primary);
    }

    .nav-list {
      display: flex;
      align-items: center;
      min-height: 46px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-list::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      flex: 0 0 auto;
      padding: 0 27px;
      color: #fff;
      line-height: 46px;
      font-size: 15px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--primary-dark);
    }

    main {
      padding: 22px 0 50px;
    }

    .hero {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 220px;
      gap: 16px;
    }

    .category,
    .login-panel {
      background: #fff;
      border-radius: 6px;
    }

    .category {
      padding: 8px 0;
    }

    .category-title {
      padding: 10px 17px;
      color: var(--primary);
      font-weight: 700;
    }

    .category-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 17px;
      color: #555;
      font-size: 14px;
    }

    .category-item:hover {
      color: var(--primary);
      background: #fff4f3;
    }

    .banner {
      position: relative;
      min-height: 300px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(210, 37, 29, 0.92), rgba(245, 112, 43, 0.72)),
        url("https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1200&q=85")
        center / cover;
      border-radius: 6px;
    }

    .banner-content {
      position: relative;
      z-index: 1;
      padding: 55px 48px;
      color: #fff;
    }

    .banner h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    .banner p {
      margin: 0;
      font-size: 17px;
    }

    .banner button {
      margin-top: 30px;
      padding: 10px 22px;
      border: 0;
      border-radius: 4px;
      color: var(--primary);
      background: #fff;
      font-weight: 700;
    }

    .login-panel {
      padding: 25px 18px;
      text-align: center;
    }

    .avatar {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 50%;
      color: var(--primary);
      background: #ffe5e2;
      font-size: 24px;
    }

    .login-panel h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .login-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .primary-button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
    }

    .section {
      margin-top: 28px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      padding-left: 10px;
      border-left: 4px solid var(--primary);
      font-size: 21px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 15px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.12);
      transform: translateY(-3px);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 12px;
    }

    .product-name {
      display: -webkit-box;
      min-height: 42px;
      overflow: hidden;
      line-height: 21px;
      font-size: 14px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .product-meta {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 6px;
      margin-top: 14px;
    }

    .price {
      color: var(--primary);
      font-size: 21px;
      font-weight: 700;
    }

    .price::before {
      content: "¥";
      margin-right: 2px;
      font-size: 13px;
    }

    .sold {
      color: #999;
      font-size: 12px;
      white-space: nowrap;
    }

    .buy-button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid var(--primary);
      border-radius: 4px;
      color: var(--primary);
      background: #fff;
    }

    .buy-button:hover {
      color: #fff;
      background: var(--primary);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 45px;
      color: #999;
      background: #fff;
      text-align: center;
    }

    footer {
      padding: 25px 16px;
      color: #999;
      background: #fff;
      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .hero {
        grid-template-columns: 190px minmax(0, 1fr);
      }

      .login-panel {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 24px, var(--container));
      }

      .topbar-content {
        justify-content: center;
      }

      .topbar-content > span,
      .topbar-links a:not(:first-child) {
        display: none;
      }

      .header-content {
        grid-template-columns: 1fr auto;
        gap: 12px;
        min-height: auto;
        padding: 14px 0;
      }

      .brand {
        font-size: 20px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

      .search {
        grid-column: 1 / -1;
        grid-row: 2;
        height: 40px;
      }

      .cart-button {
        padding: 8px 9px;
        font-size: 0;
      }

      .cart-button::before {
        content: "购物车";
        font-size: 13px;
      }

      .nav-item {
        padding: 0 18px;
      }

      main {
        padding-top: 12px;
      }

      .hero {
        display: block;
      }

      .category {
        display: none;
      }

      .banner {
        min-height: 210px;
      }

      .banner-content {
        padding: 36px 24px;
      }

      .banner h1 {
        font-size: 25px;
      }

      .banner p {
        max-width: 230px;
        font-size: 14px;
        line-height: 1.6;
      }

      .section {
        margin-top: 22px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 13px;
      }

      .product-meta {
        display: block;
        margin-top: 10px;
      }

      .sold {
        display: block;
        margin-top: 3px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar-content">
      <span>欢迎来到团购优选</span>
      <div class="topbar-links">
        <a href="#">请登录</a>
        <a href="#">免费注册</a>
        <a href="#">我的订单</a>
        <a href="#">帮助中心</a>
      </div>
    </div>
  </div>

  <header class="header">
    <div class="container header-content">
      <a class="brand" href="index.html">
        <span class="brand-mark">优</span>
        <span>团购优选</span>
      </a>

      <div class="search">
        <input id="searchInput" type="search" placeholder="搜索商品、品牌或店铺" />
        <button type="button" id="searchButton">搜索</button>
      </div>

      <button class="cart-button" type="button" onclick="showCart()">
        购物车
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <nav class="nav">
    <div class="container nav-list">
      <a class="nav-item active" href="index.html">首页</a>
      <a class="nav-item" href="#products">热门推荐</a>
      <a class="nav-item" href="#products">百亿补贴</a>
      <a class="nav-item" href="#products">食品生鲜</a>
      <a class="nav-item" href="#products">服饰鞋包</a>
      <a class="nav-item" href="#products">家居百货</a>
    </div>
  </nav>

  <main>
    <div class="container">
      <section class="hero">
        <aside class="category">
          <div class="category-title">热门分类</div>
          <a class="category-item" href="#products">手机数码 <span>›</span></a>
          <a class="category-item" href="#products">电脑办公 <span>›</span></a>
          <a class="category-item" href="#products">食品饮料 <span>›</span></a>
          <a class="category-item" href="#products">服装鞋包 <span>›</span></a>
          <a class="category-item" href="#products">家用电器 <span>›</span></a>
          <a class="category-item" href="#products">美妆护肤 <span>›</span></a>
          <a class="category-item" href="#products">家具家装 <span>›</span></a>
          <a class="category-item" href="#products">运动户外 <span>›</span></a>
        </aside>

        <section class="banner">
          <div class="banner-content">
            <h1>百亿补贴，天天好价</h1>
            <p>精选商品限时直降，品质生活轻松购</p>
            <button type="button" onclick="document.getElementById('products').scrollIntoView({ behavior: 'smooth' })">
              立即抢购
            </button>
          </div>
        </section>

        <aside class="login-panel">
          <div class="avatar">人</div>
          <h3>Hi，欢迎来到团购优选</h3>
          <p>登录后可查看订单和优惠券</p>
          <button class="primary-button" type="button" onclick="alert('此处可接入登录页面或登录接口')">
            立即登录
          </button>
        </aside>
      </section>

      <section class="section" id="products">
        <div class="section-head">
          <h2 class="section-title">热门推荐</h2>
          <span id="resultText">精选优质商品</span>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div>团购优选 · 品质生活，实惠到家</div>
    <div>关于我们　|　联系客服　|　商家入驻　|　隐私政策</div>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        name: "无线蓝牙耳机 降噪运动耳机 长续航高音质",
        price: 39.9,
        originalPrice: 69.9,
        sold: "已售 2.3万+",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 2,
        name: "新鲜红心猕猴桃 水果礼盒 当季精选",
        price: 29.9,
        originalPrice: 45.9,
        sold: "已售 1.8万+",
        image: "https://images.unsplash.com/photo-1618897996318-5a901fa6ca71?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 3,
        name: "简约纯棉短袖T恤 夏季舒适休闲上衣",
        price: 19.9,
        originalPrice: 39.9,
        sold: "已售 5.6万+",
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 4,
        name: "大容量保温杯 便携户外随行水杯",
        price: 25.8,
        originalPrice: 49.9,
        sold: "已售 9800+",
        image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 5,
        name: "家用收纳箱 大容量衣物整理储物箱",
        price: 16.8,
        originalPrice: 29.9,
        sold: "已售 3.2万+",
        image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 6,
        name: "智能护眼台灯 学习阅读书桌台灯",
        price: 49.9,
        originalPrice: 89.9,
        sold: "已售 7600+",
        image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 7,
        name: "舒适运动鞋 轻便透气休闲跑步鞋",
        price: 59.9,
        originalPrice: 99.9,
        sold: "已售 4.7万+",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"
      },
      {
        id: 8,
        name: "便携榨汁杯 USB充电迷你果汁机",
        price: 32.8,
        originalPrice: 59.9,
        sold: "已售 8900+",
        image: "https://images.unsplash.com/photo-1570197788417-0e82375c9371?auto=format&fit=crop&w=700&q=80"
      }
    ];

    let cartCount = Number(localStorage.getItem("cartCount") || 0);

    function updateCartCount() {
      document.getElementById("cartCount").textContent = cartCount;
    }

    function formatPrice(price) {
      return Number(price).toFixed(2);
    }

    function selectProduct(productId, addToCart = false) {
      const product = products.find(item => item.id === productId);

      if (!product) return;

      localStorage.setItem("selectedProduct", JSON.stringify(product));

      if (addToCart) {
        cartCount += 1;
        localStorage.setItem("cartCount", cartCount);
        updateCartCount();
      }

      window.location.href = "checkout.html";
    }

    function renderProducts(list) {
      const productGrid = document.getElementById("productGrid");
      const resultText = document.getElementById("resultText");

      resultText.textContent = list.length === products.length
        ? "精选优质商品"
        : `找到 ${list.length} 件商品`;

      if (!list.length) {
        productGrid.innerHTML = '<div class="empty">没有找到相关商品，请换一个关键词。</div>';
        return;
      }

      productGrid.innerHTML = list.map(product => `
        <article class="product-card" onclick="selectProduct(${product.id})">
          <img
            class="product-image"
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
          >
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-meta">
              <strong class="price">${formatPrice(product.price)}</strong>
              <span class="sold">${product.sold}</span>
            </div>
            <button
              class="buy-button"
              type="button"
              onclick="event.stopPropagation(); selectProduct(${product.id}, true)"
            >
              立即购买
            </button>
          </div>
        </article>
      `).join("");
    }

    function searchProducts() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

      const filteredProducts = products.filter(product => {
        return product.name.toLowerCase().includes(keyword);
      });

      renderProducts(keyword ? filteredProducts : products);

      document.getElementById("products").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function showCart() {
      alert(`购物车中目前有 ${cartCount} 件商品。`);
    }

    document.getElementById("searchButton").addEventListener("click", searchProducts);

    document.getElementById("searchInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchProducts();
      }
    });

    updateCartCount();
    renderProducts(products);
  </script>
</body>
</html>
