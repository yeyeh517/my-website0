<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清新集市</title>
  <style>
    :root {
      --primary: #ee5d5d;
      --primary-dark: #d94b4b;
      --mint: #eaf8f1;
      --mint-dark: #ccefdc;
      --yellow: #fff5d9;
      --text: #26332d;
      --muted: #718079;
      --border: #e4ece7;
      --background: #f7faf8;
      --white: #ffffff;
      --shadow: 0 10px 30px rgba(41, 72, 57, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app-view {
      display: none;
      min-height: 100vh;
    }

    .app-view.active {
      display: block;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* 首页 */
    .site-header {
      position: sticky;
      z-index: 20;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .header-main {
      display: grid;
      grid-template-columns: auto minmax(260px, 620px) auto;
      align-items: center;
      gap: 30px;
      min-height: 78px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--primary);
      font-size: 23px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: var(--primary);
      font-size: 19px;
    }

    .search-box {
      display: flex;
      height: 42px;
      overflow: hidden;
      border: 1px solid var(--mint-dark);
      border-radius: 8px;
      background: #fff;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(238, 93, 93, 0.12);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      padding: 0 14px;
      color: var(--text);
      background: transparent;
    }

    .search-button {
      width: 76px;
      flex: 0 0 76px;
      border: 0;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
    }

    .cart-icon-button {
      position: relative;
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font-size: 21px;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      display: none;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 50px;
      color: #fff;
      background: var(--primary);
      font-size: 11px;
      font-weight: 700;
    }

    .cart-badge.visible {
      display: grid;
    }

    .category-nav {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .category-list {
      display: flex;
      gap: 6px;
      min-height: 52px;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-list::-webkit-scrollbar {
      display: none;
    }

    .category-button {
      flex: 0 0 auto;
      padding: 8px 15px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
    }

    .category-button:hover,
    .category-button.active {
      color: var(--primary);
      background: #fff0ef;
      font-weight: 700;
    }

    .home-main {
      padding: 28px 0 80px;
    }

    .intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      padding: 24px 30px;
      border-radius: 8px;
      background: var(--mint);
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .intro-label {
      padding: 9px 12px;
      border-radius: 6px;
      color: #a46e15;
      background: var(--yellow);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .product-result {
      color: var(--muted);
      font-size: 13px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .product-card {
      display: flex;
      min-height: 225px;
      flex-direction: column;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-3px);
    }

    .product-icon {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      margin-bottom: 15px;
      border-radius: 8px;
      background: var(--mint);
      font-size: 29px;
    }

    .product-category {
      margin-bottom: 7px;
      color: #77a187;
      font-size: 12px;
    }

    .product-name {
      min-height: 42px;
      margin: 0;
      line-height: 1.5;
      font-size: 15px;
      font-weight: 700;
    }

    .product-bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 16px;
    }

    .product-price {
      color: var(--primary);
      font-size: 21px;
      font-weight: 700;
    }

    .product-price::before {
      content: "¥";
      margin-right: 2px;
      font-size: 13px;
    }

    .add-button {
      padding: 8px 10px;
      border: 1px solid var(--primary);
      border-radius: 5px;
      color: var(--primary);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .add-button:hover {
      color: #fff;
      background: var(--primary);
    }

    .empty-result {
      grid-column: 1 / -1;
      padding: 54px 20px;
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    /* 浮动购物车 */
    .floating-cart {
      position: fixed;
      z-index: 25;
      right: 26px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 15px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 22px rgba(238, 93, 93, 0.35);
      font-weight: 700;
    }

    .floating-cart-count {
      display: grid;
      min-width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      color: var(--primary);
      background: #fff;
      font-size: 12px;
    }

    /* 购物车弹窗 */
    .modal-mask {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(31, 48, 39, 0.42);
    }

    .modal-mask.show {
      display: flex;
    }

    .cart-modal {
      width: min(680px, 100%);
      max-height: min(720px, calc(100vh - 40px));
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 19px 22px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .close-button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: #f3f6f4;
      font-size: 20px;
    }

    .cart-content {
      max-height: 420px;
      overflow-y: auto;
      padding: 0 22px;
    }

    .cart-empty {
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 7px;
      background: var(--mint);
      font-size: 23px;
    }

    .cart-item-name {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
    }

    .cart-item-price {
      color: var(--muted);
      font-size: 13px;
    }

    .cart-item-right {
      text-align: right;
    }

    .quantity-control {
      display: inline-flex;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    .quantity-control button {
      width: 26px;
      height: 27px;
      border: 0;
      color: var(--text);
      background: #f7faf8;
      font-size: 16px;
    }

    .quantity-control span {
      display: grid;
      width: 30px;
      height: 27px;
      place-items: center;
      border-right: 1px solid var(--border);
      border-left: 1px solid var(--border);
      font-size: 13px;
    }

    .cart-subtotal {
      margin-top: 7px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 17px 22px;
      background: #fbfcfb;
    }

    .modal-total-label {
      color: var(--muted);
      font-size: 13px;
    }

    .modal-total-price {
      margin-top: 3px;
      color: var(--primary);
      font-size: 24px;
      font-weight: 700;
    }

    .checkout-button,
    .submit-order-button,
    .continue-button {
      padding: 12px 22px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
    }

    .checkout-button:hover,
    .submit-order-button:hover,
    .continue-button:hover {
      background: var(--primary-dark);
    }

    /* 结算页 */
    .simple-header {
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .simple-header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
    }

    .page-title-small {
      color: var(--muted);
      font-size: 15px;
    }

    .back-home {
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
    }

    .checkout-main {
      padding: 30px 0 70px;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      align-items: start;
      gap: 20px;
    }

    .checkout-panel {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .checkout-panel + .checkout-panel {
      margin-top: 18px;
    }

    .checkout-panel h1,
    .checkout-panel h2 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    .checkout-product-list {
      display: grid;
      gap: 13px;
    }

    .checkout-product {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border);
    }

    .checkout-product:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .checkout-product-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 7px;
      background: var(--mint);
      font-size: 24px;
    }

    .checkout-product-name {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 700;
    }

    .checkout-product-detail {
      color: var(--muted);
      font-size: 13px;
    }

    .checkout-product-total {
      color: var(--primary);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .form-field.full-width {
      grid-column: 1 / -1;
    }

    .form-field label {
      display: block;
      margin-bottom: 8px;
      color: #4d5c54;
      font-size: 14px;
      font-weight: 700;
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      border: 1px solid #dce7e1;
      border-radius: 6px;
      outline: none;
      padding: 11px 12px;
      color: var(--text);
      background: #fff;
    }

    .form-field textarea {
      min-height: 92px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(238, 93, 93, 0.1);
    }

    .payment-options {
      display: grid;
      gap: 10px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .payment-option:has(input:checked) {
      border-color: #72be90;
      background: #f4fcf7;
    }

    .payment-option input {
      width: 16px;
      height: 16px;
      accent-color: #42a96a;
    }

    .payment-option-icon {
      font-size: 21px;
    }

    .payment-option-text strong {
      display: block;
      font-size: 14px;
    }

    .payment-option-text span {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-panel {
      position: sticky;
      top: 92px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 13px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin: 22px 0 17px;
      padding-top: 17px;
      border-top: 1px solid var(--border);
      font-weight: 700;
    }

    .summary-total-price {
      color: var(--primary);
      font-size: 27px;
    }

    .submit-order-button {
      width: 100%;
      font-size: 16px;
    }

    .form-error {
      display: none;
      margin: 12px 0 0;
      color: var(--primary);
      font-size: 13px;
    }

    .form-error.show {
      display: block;
    }

    /* 支付页 */
    .payment-main {
      display: grid;
      min-height: calc(100vh - 72px);
      place-items: center;
      padding: 30px 16px;
    }

    .payment-card {
      width: min(470px, 100%);
      padding: 42px 30px;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .payment-status-icon {
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      color: #fff;
      background: #74bd90;
      font-size: 32px;
    }

    .payment-card h1 {
      margin: 0 0 12px;
      font-size: 23px;
    }

    .payment-card p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .payment-amount {
      margin: 18px 0;
      color: var(--primary);
      font-size: 34px;
      font-weight: 700;
    }

    .payment-order-number {
      padding: 12px;
      border-radius: 6px;
      color: var(--muted);
      background: #f5f9f6;
      font-size: 13px;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      animation: blink 1s infinite alternate;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      to {
        opacity: 0.2;
        transform: translateY(-4px);
      }
    }

    .payment-success {
      display: none;
    }

    .payment-success.show {
      display: block;
    }

    .payment-processing.hide {
      display: none;
    }

    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .checkout-layout {
        grid-template-columns: 1fr;
      }

      .summary-panel {
        position: static;
      }
    }

    @media (max-width: 620px) {
      .container {
        width: min(100% - 24px, 1180px);
      }

      .header-main {
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 12px 0;
      }

      .brand {
        font-size: 19px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

      .search-box {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .category-list {
        min-height: 47px;
      }

      .category-button {
        padding: 7px 12px;
      }

      .home-main {
        padding-top: 16px;
      }

      .intro {
        align-items: flex-start;
        flex-direction: column;
        padding: 20px;
      }

      .intro h1 {
        font-size: 21px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-card {
        min-height: 215px;
        padding: 14px;
      }

      .product-icon {
        width: 47px;
        height: 47px;
        margin-bottom: 12px;
        font-size: 25px;
      }

      .product-name {
        font-size: 14px;
      }

      .product-bottom {
        display: block;
      }

      .add-button {
        width: 100%;
        margin-top: 9px;
      }

      .floating-cart {
        right: 16px;
        bottom: 18px;
        min-height: 44px;
        padding: 0 13px;
      }

      .modal-mask {
        align-items: flex-end;
        padding: 0;
      }

      .cart-modal {
        max-height: 84vh;
        border-radius: 10px 10px 0 0;
      }

      .cart-content {
        max-height: 48vh;
        padding: 0 15px;
      }

      .modal-header,
      .modal-footer {
        padding-right: 15px;
        padding-left: 15px;
      }

      .cart-item {
        grid-template-columns: 38px minmax(0, 1fr);
      }

      .cart-item-right {
        grid-column: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
      }

      .cart-item-icon {
        width: 38px;
        height: 38px;
        font-size: 20px;
      }

      .modal-footer {
        align-items: end;
      }

      .checkout-main {
        padding-top: 18px;
      }

      .checkout-panel {
        padding: 17px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .form-field.full-width {
        grid-column: auto;
      }

      .simple-header-content {
        min-height: 60px;
      }

      .page-title-small {
        font-size: 13px;
      }

      .payment-card {
        padding: 34px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- 首页 -->
  <section id="homeView" class="app-view active">
    <header class="site-header">
      <div class="container header-main">
        <div class="brand">
          <span class="brand-mark">优</span>
          <span>清新集市</span>
        </div>

        <div class="search-box">
          <input id="searchInput" type="search" placeholder="搜索你想要的商品" />
          <button class="search-button" id="searchButton" type="button">搜索</button>
        </div>

        <button class="cart-icon-button" type="button" onclick="openCart()" aria-label="打开购物车">
          🛒
          <span id="headerCartBadge" class="cart-badge">0</span>
        </button>
      </div>
    </header>

    <nav class="category-nav">
      <div class="container category-list" id="categoryList"></div>
    </nav>

    <main class="container home-main">
      <section class="intro">
        <div>
          <h1>每日好物，轻松带回家</h1>
          <p>精选日常商品，简单购物，安心结算。</p>
        </div>
        <span class="intro-label">满 99 元免运费</span>
      </section>

      <section>
        <div class="section-header">
          <h2>商品列表</h2>
          <span class="product-result" id="resultText">正在展示全部商品</span>
        </div>
        <div id="productGrid" class="product-grid"></div>
      </section>
    </main>

    <button class="floating-cart" type="button" onclick="openCart()">
      <span>🛒 购物车</span>
      <span id="floatingCartCount" class="floating-cart-count">0</span>
    </button>
  </section>

  <!-- 结算页 -->
  <section id="checkoutView" class="app-view">
    <header class="simple-header">
      <div class="container simple-header-content">
        <div class="brand">
          <span class="brand-mark">优</span>
          <span>清新集市</span>
        </div>
        <span class="page-title-small">确认订单</span>
        <button class="back-home" type="button" onclick="showView('homeView')">返回首页</button>
      </div>
    </header>

    <main class="container checkout-main">
      <div class="checkout-layout">
        <div>
          <section class="checkout-panel">
            <h1>确认订单</h1>
            <div id="checkoutProductList" class="checkout-product-list"></div>
          </section>

          <section class="checkout-panel">
            <h2>收货信息</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="receiverName">收货人姓名</label>
                <input id="receiverName" type="text" placeholder="请输入姓名" />
              </div>

              <div class="form-field">
                <label for="receiverPhone">联系电话</label>
                <input id="receiverPhone" type="tel" inputmode="numeric" placeholder="请输入手机号" />
              </div>

              <div class="form-field full-width">
                <label for="receiverAddress">收货地址</label>
                <textarea id="receiverAddress" placeholder="请输入省、市、区及详细地址"></textarea>
              </div>
            </div>
            <p id="formError" class="form-error">请完整填写收货人姓名、联系电话和地址。</p>
          </section>

          <section class="checkout-panel">
            <h2>支付方式</h2>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="微信支付" checked />
                <span class="payment-option-icon">💬</span>
                <span class="payment-option-text">
                  <strong>微信支付</strong>
                  <span>推荐使用微信完成付款</span>
                </span>
              </label>

              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="支付宝" />
                <span class="payment-option-icon">💳</span>
                <span class="payment-option-text">
                  <strong>支付宝</strong>
                  <span>使用支付宝完成付款</span>
                </span>
              </label>
            </div>
          </section>
        </div>

        <aside class="checkout-panel summary-panel">
          <h2>订单金额</h2>
          <div class="summary-row">
            <span>商品数量</span>
            <span id="checkoutItemCount">0 件</span>
          </div>
          <div class="summary-row">
            <span>商品金额</span>
            <span id="checkoutGoodsTotal">¥0.00</span>
          </div>
          <div class="summary-row">
            <span>运费</span>
            <span id="checkoutShipping">¥0.00</span>
          </div>
          <div class="summary-total">
            <span>实付款</span>
            <span id="checkoutTotal" class="summary-total-price">¥0.00</span>
          </div>
          <button class="submit-order-button" type="button" onclick="submitOrder()">提交订单</button>
        </aside>
      </div>
    </main>
  </section>

  <!-- 支付页 -->
  <section id="paymentView" class="app-view">
    <header class="simple-header">
      <div class="container simple-header-content">
        <div class="brand">
          <span class="brand-mark">优</span>
          <span>清新集市</span>
        </div>
        <span class="page-title-small">订单支付</span>
      </div>
    </header>

    <main class="payment-main">
      <section class="payment-card">
        <div id="paymentProcessing" class="payment-processing">
          <div class="payment-status-icon">¥</div>
          <h1>正在处理支付</h1>
          <p>订单号：<span id="paymentOrderNumber"></span></p>
          <div id="paymentAmount" class="payment-amount">¥0.00</div>
          <div class="payment-order-number">正在跳转至安全支付服务</div>
          <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div id="paymentSuccess" class="payment-success">
          <div class="payment-status-icon">✓</div>
          <h1>感谢购买</h1>
          <p>您的订单已支付成功，我们会尽快为您安排发货。</p>
          <div id="successOrderNumber" class="payment-order-number"></div>
          <button class="continue-button" type="button" onclick="finishShopping()">继续购物</button>
        </div>
      </section>
    </main>
  </section>

  <!-- 购物车弹窗 -->
  <div id="cartModalMask" class="modal-mask" onclick="handleMaskClick(event)">
    <section class="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
      <header class="modal-header">
        <h2 id="cartTitle">我的购物车</h2>
        <button class="close-button" type="button" onclick="closeCart()" aria-label="关闭购物车">×</button>
      </header>

      <div id="cartContent" class="cart-content"></div>

      <footer class="modal-footer">
        <div>
          <div class="modal-total-label">合计</div>
          <div id="cartTotal" class="modal-total-price">¥0.00</div>
        </div>
        <button id="goCheckoutButton" class="checkout-button" type="button" onclick="goCheckout()">
          去结算
        </button>
      </footer>
    </section>
  </div>

  <script>
    const products = [
      { id: 1, name: "香甜红富士苹果", price: 19.9, icon: "🍎", category: "食品生鲜" },
      { id: 2, name: "醇香挂耳咖啡", price: 29.9, icon: "☕", category: "食品生鲜" },
      { id: 3, name: "无线蓝牙耳机", price: 69.9, icon: "🎧", category: "数码好物" },
      { id: 4, name: "轻便运动水杯", price: 25.8, icon: "🥤", category: "家居生活" },
      { id: 5, name: "舒适纯棉短袖", price: 39.9, icon: "👕", category: "服饰鞋包" },
      { id: 6, name: "绿植桌面盆栽", price: 22.5, icon: "🪴", category: "家居生活" },
      { id: 7, name: "护眼阅读台灯", price: 59.9, icon: "💡", category: "数码好物" },
      { id: 8, name: "燕麦坚果早餐包", price: 18.8, icon: "🥣", category: "食品生鲜" },
      { id: 9, name: "简约帆布手提包", price: 45.0, icon: "👜", category: "服饰鞋包" },
      { id: 10, name: "柔软亲肤毛巾", price: 15.9, icon: "🧺", category: "家居生活" },
      { id: 11, name: "便携充电宝", price: 79.0, icon: "🔋", category: "数码好物" },
      { id: 12, name: "新鲜草莓礼盒", price: 32.8, icon: "🍓", category: "食品生鲜" }
    ];

    const categories = ["全部", "食品生鲜", "数码好物", "家居生活", "服饰鞋包"];
    const cart = [];
    let currentCategory = "全部";
    let paymentTimer = null;

    function formatPrice(price) {
      return `¥${Number(price).toFixed(2)}`;
    }

    function getCartCount() {
      return cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function getCartTotal() {
      return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function getShippingFee() {
      return getCartTotal() >= 99 || getCartTotal() === 0 ? 0 : 8;
    }

    function updateCartBadge() {
      const count = getCartCount();
      const headerBadge = document.getElementById("headerCartBadge");
      const floatingCount = document.getElementById("floatingCartCount");

      headerBadge.textContent = count;
      floatingCount.textContent = count;
      headerBadge.classList.toggle("visible", count > 0);
    }

    function renderCategories() {
      const categoryList = document.getElementById("categoryList");

      categoryList.innerHTML = categories.map(category => `
        <button
          class="category-button ${category === currentCategory ? "active" : ""}"
          type="button"
          onclick="filterCategory('${category}')"
        >
          ${category}
        </button>
      `).join("");
    }

    function renderProducts() {
      const productGrid = document.getElementById("productGrid");
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();

      const filteredProducts = products.filter(product => {
        const matchCategory = currentCategory === "全部" || product.category === currentCategory;
        const matchKeyword = product.name.toLowerCase().includes(keyword);
        return matchCategory && matchKeyword;
      });

      document.getElementById("resultText").textContent =
        `共找到 ${filteredProducts.length} 件商品`;

      if (!filteredProducts.length) {
        productGrid.innerHTML = `
          <div class="empty-result">
            没有找到相关商品，请尝试其他关键词。
          </div>
        `;
        return;
      }

      productGrid.innerHTML = filteredProducts.map(product => `
        <article class="product-card">
          <div class="product-icon">${product.icon}</div>
          <div class="product-category">${product.category}</div>
          <h3 class="product-name">${product.name}</h3>
          <div class="product-bottom">
            <strong class="product-price">${product.price.toFixed(2)}</strong>
            <button class="add-button" type="button" onclick="addToCart(${product.id})">
              加入购物车
            </button>
          </div>
        </article>
      `).join("");
    }

    function filterCategory(category) {
      currentCategory = category;
      renderCategories();
      renderProducts();
    }

    function addToCart(productId) {
      const product = products.find(item => item.id === productId);
      const cartItem = cart.find(item => item.id === productId);

      if (cartItem) {
        cartItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartBadge();
      renderCart();
    }

    function changeCartQuantity(productId, change) {
      const cartItem = cart.find(item => item.id === productId);

      if (!cartItem) {
        return;
      }

      cartItem.quantity += change;

      if (cartItem.quantity <= 0) {
        const itemIndex = cart.findIndex(item => item.id === productId);
        cart.splice(itemIndex, 1);
      }

      updateCartBadge();
      renderCart();
    }

    function renderCart() {
      const cartContent = document.getElementById("cartContent");
      const cartTotal = document.getElementById("cartTotal");
      const goCheckoutButton = document.getElementById("goCheckoutButton");

      cartTotal.textContent = formatPrice(getCartTotal());
      goCheckoutButton.disabled = cart.length === 0;

      if (!cart.length) {
        cartContent.innerHTML = `<div class="cart-empty">购物车还是空的，去挑选一些喜欢的商品吧。</div>`;
        return;
      }

      cartContent.innerHTML = cart.map(item => `
        <article class="cart-item">
          <div class="cart-item-icon">${item.icon}</div>
          <div>
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">单价 ${formatPrice(item.price)}</div>
          </div>
          <div class="cart-item-right">
            <div class="quantity-control">
              <button type="button" onclick="changeCartQuantity(${item.id}, -1)" aria-label="减少数量">−</button>
              <span>${item.quantity}</span>
              <button type="button" onclick="changeCartQuantity(${item.id}, 1)" aria-label="增加数量">+</button>
            </div>
            <div class="cart-subtotal">小计 ${formatPrice(item.price * item.quantity)}</div>
          </div>
        </article>
      `).join("");
    }

    function openCart() {
      renderCart();
      document.getElementById("cartModalMask").classList.add("show");
    }

    function closeCart() {
      document.getElementById("cartModalMask").classList.remove("show");
    }

    function handleMaskClick(event) {
      if (event.target.id === "cartModalMask") {
        closeCart();
      }
    }

    function showView(viewId) {
      clearTimeout(paymentTimer);

      document.querySelectorAll(".app-view").forEach(view => {
        view.classList.remove("active");
      });

      document.getElementById(viewId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goCheckout() {
      if (!cart.length) {
        return;
      }

      closeCart();
      renderCheckout();
      showView("checkoutView");
    }

    function renderCheckout() {
      const checkoutList = document.getElementById("checkoutProductList");
      const goodsTotal = getCartTotal();
      const shippingFee = getShippingFee();
      const total = goodsTotal + shippingFee;

      checkoutList.innerHTML = cart.map(item => `
        <article class="checkout-product">
          <div class="checkout-product-icon">${item.icon}</div>
          <div>
            <div class="checkout-product-name">${item.name}</div>
            <div class="checkout-product-detail">
              ${formatPrice(item.price)} × ${item.quantity}
            </div>
          </div>
          <div class="checkout-product-total">
            ${formatPrice(item.price * item.quantity)}
          </div>
        </article>
      `).join("");

      document.getElementById("checkoutItemCount").textContent = `${getCartCount()} 件`;
      document.getElementById("checkoutGoodsTotal").textContent = formatPrice(goodsTotal);
      document.getElementById("checkoutShipping").textContent =
        shippingFee === 0 ? "免运费" : formatPrice(shippingFee);
      document.getElementById("checkoutTotal").textContent = formatPrice(total);
    }

    function submitOrder() {
      const name = document.getElementById("receiverName").value.trim();
      const phone = document.getElementById("receiverPhone").value.trim();
      const address = document.getElementById("receiverAddress").value.trim();
      const error = document.getElementById("formError");

      if (!name || !phone || !address) {
        error.classList.add("show");
        return;
      }

      error.classList.remove("show");

      const orderNumber = `QX${Date.now().toString().slice(-10)}`;
      const total = getCartTotal() + getShippingFee();

      document.getElementById("paymentOrderNumber").textContent = orderNumber;
      document.getElementById("paymentAmount").textContent = formatPrice(total);
      document.getElementById("successOrderNumber").textContent =
        `订单号：${orderNumber} · 实付金额：${formatPrice(total)}`;

      document.getElementById("paymentProcessing").classList.remove("hide");
      document.getElementById("paymentSuccess").classList.remove("show");

      showView("paymentView");

      paymentTimer = setTimeout(() => {
        document.getElementById("paymentProcessing").classList.add("hide");
        document.getElementById("paymentSuccess").classList.add("show");
      }, 2000);
    }

    function finishShopping() {
      cart.splice(0, cart.length);
      updateCartBadge();
      renderCart();

      document.getElementById("receiverName").value = "";
      document.getElementById("receiverPhone").value = "";
      document.getElementById("receiverAddress").value = "";
      document.getElementById("searchInput").value = "";
      currentCategory = "全部";

      renderCategories();
      renderProducts();
      showView("homeView");
    }

    document.getElementById("searchButton").addEventListener("click", renderProducts);

    document.getElementById("searchInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        renderProducts();
      }
    });

    document.getElementById("searchInput").addEventListener("input", renderProducts);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeCart();
      }
    });

    renderCategories();
    renderProducts();
    renderCart();
    updateCartBadge();
  </script>
</body>
</html>
